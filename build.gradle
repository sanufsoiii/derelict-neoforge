plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.91'
    id 'org.jetbrains.kotlin.jvm' version '2.4.0'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'derelict-neoforge'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

kotlin {
    jvmToolchain(21)
}

configurations {
    owoInterfaceInjection { transitive = false }
}

var extractOwoInterfaceInjections = tasks.register('extractOwoInterfaceInjections', Copy) {
    from({ zipTree(configurations.owoInterfaceInjection.singleFile) }) { include 'interfaces.json' }
    into layout.buildDirectory.dir('owoInterfaceInjection')
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // src/main/resources/META-INF/accesstransformer.cfg is picked up automatically

    // owo-lib ships interface injection data (interfaces.json), e.g. AbstractWidget -> owo ComponentStub
    // (Loom applied it on Fabric). Same trick as in the Mine Cells port.
    interfaceInjectionData {
        from(extractOwoInterfaceInjections.map { it.destinationDir.toPath().resolve('interfaces.json').toFile() })
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // Smoke test: the client must reach the title screen and exit by itself.
        // The mod reads -Dderelict.port.exitOnTitle=true.
        clientSmoke {
            client()
            systemProperty 'derelict.port.exitOnTitle', 'true'
        }
        // Dedicated-server smoke test. The mod reads -Dderelict.port.serverSmoke=true.
        serverSmoke {
            server()
            programArgument '--nogui'
            systemProperty 'derelict.port.serverSmoke', 'true'
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    maven { name = 'Kotlin for Forge'; url = 'https://thedarkcolour.github.io/KotlinForForge/'; content { includeGroup 'thedarkcolour' } }
    maven { name = 'WispForest (owo-lib)'; url = 'https://maven.wispforest.io/releases' }
    maven { name = 'Sinytra (forgified-fabric-api, needed by owo-lib-neoforge)'; url = 'https://maven.su5ed.dev/releases' }
    maven { name = 'MinecraftForge (TerraBlender)'; url = 'https://maven.minecraftforge.net/'; content { includeGroup 'com.github.glitchfiend' } }
    maven { name = 'JitPack (Crunch)'; url = 'https://jitpack.io'; content { includeGroup 'com.github.Redempt' } }
    maven { name = 'Shedaniel (REI)'; url = 'https://maven.shedaniel.me/' }
    maven { name = 'TerraformersMC (EMI)'; url = 'https://maven.terraformersmc.com/' }
    mavenCentral()
}

dependencies {
    // Kotlin for Forge: Kotlin language provider + stdlib (Fabric Language Kotlin on the Fabric side).
    implementation "thedarkcolour:kotlinforforge-neoforge:${kff_version}"

    // owo-lib: official NeoForge build, same 0.12.15 API as on Fabric. Its annotation processor generates the
    // DerelictConfig/DerelictClientConfig wrappers from the @Config models (see generateConfigs below).
    implementation "io.wispforest:owo-lib-neoforge:${owo_version}"
    annotationProcessor "io.wispforest:owo-lib-neoforge:${owo_version}"
    owoInterfaceInjection "io.wispforest:owo-lib-neoforge:${owo_version}"

    // TerraBlender: biome regions and surface rules.
    implementation "com.github.glitchfiend:TerraBlender-neoforge:${terrablender_version}"

    // Crunch: math-expression library used by the vendored gimm1q value calculators (bundled, like upstream).
    implementation "com.github.Redempt:Crunch:${crunch_version}"
    jarJar("com.github.Redempt:Crunch") { version { strictly "[${crunch_version},)"; prefer crunch_version } }
    additionalRuntimeClasspath "com.github.Redempt:Crunch:${crunch_version}"

    // Optional recipe viewers: compile-only, the integrations only load when the viewer is installed.
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-neoforge:${rei_version}"
    compileOnly "dev.emi:emi-neoforge:${emi_version}:api"
}

// owo @Config wrappers (DerelictConfig, DerelictClientConfig) are generated by owo's annotation processor.
// Kotlin code uses them, and Kotlin is compiled before Java, so (as upstream did with its `generateConfigs` task)
// the wrappers are generated up front into a source directory that both compilers see.
var owoConfigDir = layout.buildDirectory.dir('generated/sources/owoConfig')
var generateConfigs = tasks.register('generateConfigs', JavaCompile) {
    source = fileTree('src/main/java/dev/mim1q/derelict/config') { include '*Model.java' }
    classpath = configurations.compileClasspath
    options.annotationProcessorPath = configurations.annotationProcessor
    options.compilerArgs += ['-proc:only']
    options.generatedSourceOutputDirectory = owoConfigDir
    destinationDirectory = layout.buildDirectory.dir('tmp/generateConfigs')
    options.encoding = 'UTF-8'
    options.release = 21
}
sourceSets.main.java.srcDir(generateConfigs.map { owoConfigDir.get() })

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version        : minecraft_version,
            minecraft_version_range  : minecraft_version_range,
            neo_version              : neo_version,
            neo_version_range        : neo_version_range,
            kff_loader_version_range : kff_loader_version_range,
            kff_version              : kff_version,
            mod_id                   : mod_id,
            mod_name                 : mod_name,
            mod_license              : mod_license,
            mod_version              : mod_version,
            mod_authors              : mod_authors,
            mod_description          : mod_description,
            owo_version              : owo_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs += ['-Xmaxerrs', '100000', '-Xmaxwarns', '0']
}
// The config wrappers come from generateConfigs; do not run owo's processor a second time in compileJava.
tasks.named('compileJava', JavaCompile) {
    options.compilerArgs += ['-proc:none']
}

jar {
    from('LICENSE') { rename { "${it}_derelict" } }
    from('LICENSE-gimm1q') { rename { "LICENSE_gimm1q" } }
}
