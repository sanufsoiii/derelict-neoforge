modLoader="kotlinforforge"
loaderVersion="${kff_loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/sanufsoiii/derelict-neoforge/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="derelict.mixins.json"

[[mixins]]
config="derelict_gimm1q.mixins.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="kotlinforforge"
type="required"
versionRange="[${kff_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="owo"
type="required"
versionRange="[0.12.15,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="terrablender"
type="required"
versionRange="[4.1.0.8,)"
ordering="AFTER"
side="BOTH"
